<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071c16">
<title>NoglikTalk v1.081 socium beta</title>
<style>
:root {
  --bg: #071c16;
  --panel: #0d2920;
  --panel2: #12352a;
  --gold: #d9b66d;
  --gold2: #f0d99b;
  --text: #f5f2e9;
  --muted: #a6b8ad;
  --border: rgba(217,182,109,.1);
  --danger: #f08e8e;
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, sans-serif; height:100vh; display:flex; flex-direction:column; }
input, select, button { font:inherit; }
button { cursor:pointer; }
input, select { width:100%; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:12px; }
input:focus, select:focus { border-color:var(--gold); outline:none; }
.btn { border:none; background:var(--panel2); color:var(--text); border-radius:12px; padding:12px 16px; font-weight:600; width:100%; transition:0.2s; }
.btn:hover { filter:brightness(1.1); }
.btn.primary { background:var(--gold); color:#152218; }
.btn.danger { background:rgba(240,142,142,0.1); color:var(--danger); }

#authScreen { padding:20px; max-width:400px; margin:0 auto; display:flex; flex-direction:column; justify-content:center; height:100vh; }
.auth-box { display:flex; flex-direction:column; gap:14px; }
.title { color:var(--gold2); font-size:32px; text-align:center; margin:0 0 20px; font-family:serif; }
.error { color:var(--danger); font-size:13px; text-align:center; min-height:18px; }
.avatar-upload { width:80px; height:80px; border-radius:50%; background:var(--panel); border:2px dashed var(--gold); margin:0 auto; display:grid; place-items:center; cursor:pointer; overflow:hidden; position:relative; }
.avatar-upload img { width:100%; height:100%; object-fit:cover; position:absolute; inset:0; }
.avatar-upload span { font-size:28px; color:var(--gold); }
.link { color:var(--gold2); text-align:center; font-size:14px; cursor:pointer; margin-top:10px; }

#appScreen { display:none; flex-direction:column; height:100vh; }
header { padding:14px 16px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; flex-shrink:0; }
.header-user { display:flex; align-items:center; gap:10px; font-weight:700; color:var(--gold2); }
.header-avatar { width:32px; height:32px; border-radius:50%; background:var(--panel2); border:1px solid var(--gold); display:grid; place-items:center; overflow:hidden; font-size:14px; }
.header-avatar img { width:100%; height:100%; object-fit:cover; }
.nav-bottom { display:flex; background:var(--panel); border-top:1px solid var(--border); flex-shrink:0; }
.nav-bottom button { flex:1; background:transparent; border:none; color:var(--muted); padding:12px; font-size:12px; display:flex; flex-direction:column; align-items:center; gap:4px; }
.nav-bottom button.active { color:var(--gold); }
.nav-bottom button span { font-size:18px; }

.content { flex:1; overflow-y:auto; padding:16px; }
.tab-content { display:none; flex-direction:column; gap:12px; }
.tab-content.active { display:flex; }

.search-header { display:flex; flex-direction:column; gap:10px; margin-bottom:10px; }
.filter-row { display:flex; gap:8px; }
.filter-row select { flex:0 0 130px; padding:10px; background:var(--panel2); border:1px solid var(--border); border-radius:12px; color:var(--gold2); font-weight:bold; }
.filter-row input { flex:1; }

.user-card { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:12px; display:flex; align-items:center; gap:12px; }
.user-card .info { flex:1; }
.user-card .name { font-weight:700; color:var(--text); }
.user-card .sub { font-size:12px; color:var(--muted); }
.btn-sm { width:auto; padding:6px 12px; border-radius:8px; font-size:13px; }

#chatList { display:flex; flex-direction:column; gap:8px; }
.chat-item { background:var(--panel); border-radius:12px; padding:12px; display:flex; align-items:center; gap:12px; cursor:pointer; }
.chat-item:hover { background:var(--panel2); }

#chatScreen { display:none; flex-direction:column; height:100%; position:absolute; inset:0; background:var(--bg); z-index:10; }
.chat-header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:12px; }
.back-btn { background:transparent; border:none; color:var(--gold); font-size:20px; padding:0 10px; }
#messagesBox { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
.msg { max-width:80%; padding:10px 14px; border-radius:14px; font-size:14px; }
.msg.me { background:#254631; align-self:flex-end; border-bottom-right-radius:4px; }
.msg.them { background:var(--panel2); align-self:flex-start; border-bottom-left-radius:4px; }
.chat-input-area { padding:12px; background:var(--panel); display:flex; gap:8px; }
.chat-input-area input { flex:1; border-radius:20px; }
.chat-input-area button { width:auto; border-radius:20px; padding:0 20px; }
</style>
</head>
<body>

<!-- ЭКРАН АВТОРИЗАЦИИ -->
<div id="authScreen">
  <h1 class="title">NoglikTalk</h1>
  <div class="auth-box" id="loginBox">
    <input type="text" id="loginUser" placeholder="Никнейм">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button class="btn primary" onclick="doLogin()">Войти</button>
    <div class="link" onclick="toggleAuth('reg')">Нет аккаунта? Зарегистрироваться</div>
    <div class="error" id="loginError"></div>
  </div>

  <div class="auth-box" id="regBox" style="display:none;">
    <label class="avatar-upload" for="regAvatar">
      <input type="file" id="regAvatar" accept="image/*" style="display:none;">
      <span id="regAvatarPlus">+</span>
      <img id="regAvatarImg" src="" hidden>
    </label>
    <input type="text" id="regUser" placeholder="Никнейм (от 3 символов)">
    <input type="password" id="regPass" placeholder="Пароль (от 8 символов)">
    <button class="btn primary" onclick="doRegister()">Создать аккаунт</button>
    <div class="link" onclick="toggleAuth('login')">Уже есть аккаунт? Войти</div>
    <div class="error" id="regError"></div>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="appScreen">
  <header>
    <div class="header-user">
      <div class="header-avatar" id="myAvatar">N</div>
      <span id="myName">...</span>
    </div>
    <button class="btn" style="width:auto; padding:6px 12px; font-size:12px;" onclick="doLogout()">Выйти</button>
  </header>

  <div class="content">
    <div id="tabPeople" class="tab-content active">
      <div class="search-header">
        <div class="filter-row">
          <select id="searchType" onchange="renderUsers()">
            <option value="people">Человек</option>
            <option value="characters">Персонаж</option>
            <option value="games">Игра</option>
          </select>
          <input type="text" id="searchUsers" placeholder="Поиск по нику..." oninput="renderUsers()">
        </div>
      </div>
      <div id="usersList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <div id="tabChats" class="tab-content">
      <h3 style="margin:0; color:var(--gold2);">Мои чаты</h3>
      <div id="chatList"></div>
    </div>

    <div id="tabProfile" class="tab-content">
      <div style="text-align:center; margin-bottom:20px;">
        <div style="width:96px; height:96px; border-radius:50%; background:var(--panel); border:2px solid var(--gold); margin:0 auto 12px; display:grid; place-items:center; font-size:36px; font-weight:700; color:var(--gold2); overflow:hidden;" id="profileAvatar">N</div>
        <h2 style="margin:0; color:var(--gold2);" id="profileName">...</h2>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; text-align:center; margin-bottom:30px;">
        <div><div style="font-size:24px; font-weight:700;" id="statFollowing">0</div><div style="font-size:11px; color:var(--muted);">ПОДПИСКИ</div></div>
        <div><div style="font-size:24px; font-weight:700;" id="statFollowers">0</div><div style="font-size:11px; color:var(--muted);">ПОДПИСЧИКИ</div></div>
      </div>
    </div>
  </div>

  <div class="nav-bottom">
    <button class="active" onclick="switchTab('tabPeople', this)"><span>🔍</span>Поиск</button>
    <button onclick="switchTab('tabChats', this)"><span>💬</span>Чаты</button>
    <button onclick="switchTab('tabProfile', this)"><span>👤</span>Профиль</button>
  </div>
</div>

<!-- ЭКРАН ЧАТА -->
<div id="chatScreen">
  <div class="chat-header">
    <button class="back-btn" onclick="closeChat()">←</button>
    <div style="font-weight:700;" id="chatWithName">Имя</div>
  </div>
  <div id="messagesBox"></div>
  <div class="chat-input-area">
    <input type="text" id="msgInput" placeholder="Сообщение..." onkeydown="if(event.key==='Enter') sendMsg()">
    <button class="btn primary" onclick="sendMsg()">➤</button>
  </div>
</div>

<script>
let token = localStorage.getItem("token") || null;
let myUser = null;
let usersList = [];
let currentChatId = null;
let pollInterval = null;
let chatPollInterval = null;

function toggleAuth(mode) {
  document.getElementById('loginBox').style.display = mode === 'login' ? 'flex' : 'none';
  document.getElementById('regBox').style.display = mode === 'reg' ? 'flex' : 'none';
}

let regAvatarData = "";
document.getElementById('regAvatar').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    regAvatarData = ev.target.result;
    document.getElementById('regAvatarImg').src = regAvatarData;
    document.getElementById('regAvatarImg').hidden = false;
    document.getElementById('regAvatarPlus').style.display = 'none';
  };
  reader.readAsDataURL(file);
});

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const err = document.getElementById('regError');
  err.textContent = "";
  
  if (u.length < 3) return err.textContent = "Ник от 3 символов";
  if (p.length < 8) return err.textContent = "Пароль от 8 символов";

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p, avatar: regAvatarData})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Ошибка");
    alert("Аккаунт создан! Теперь войдите.");
    toggleAuth('login');
  } catch (e) {
    err.textContent = e.message;
  }
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.textContent = "";

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: u, password: p})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Ошибка");
    
    token = data.token;
    localStorage.setItem("token", token);
    myUser = data.user;
    enterApp();
  } catch (e) {
    err.textContent = e.message;
  }
}

function doLogout() {
  localStorage.removeItem("token");
  location.reload();
}

async function enterApp() {
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'flex';
  
  await loadProfile();
  await loadUsers();
  await loadChats();
  
  if (pollInterval) clearInterval(pollInterval);
  if (chatPollInterval) clearInterval(chatPollInterval);
  
  pollInterval = setInterval(() => {
      loadUsers();
      loadChats();
  }, 5000); 
}

async function loadProfile() {
  try {
    const res = await fetch('/api/me', { headers: {'Authorization': 'Bearer ' + token} });
    if (!res.ok) { doLogout(); return; }
    const data = await res.json();
    
    document.getElementById('myName').textContent = data.username;
    document.getElementById('profileName').textContent = data.username;
    document.getElementById('statFollowing').textContent = data.following;
    document.getElementById('statFollowers').textContent = data.followers;
    
    const av = data.avatar;
    const initial = data.username[0].toUpperCase();
    const setAv = (el) => {
      if (av) el.innerHTML = `<img src="${av}">`;
      else el.textContent = initial;
    };
    setAv(document.getElementById('myAvatar'));
    setAv(document.getElementById('profileAvatar'));
  } catch (e) { console.error(e); }
}

async function loadUsers() {
  try {
    const res = await fetch('/api/users', { headers: {'Authorization': 'Bearer ' + token} });
    if (!res.ok) return;
    usersList = await res.json();
    renderUsers();
  } catch (e) { console.error(e); }
}

function renderUsers() {
  const type = document.getElementById('searchType').value;
  const q = document.getElementById('searchUsers').value.toLowerCase();
  const box = document.getElementById('usersList');
  
  box.innerHTML = "";

  if (type === 'characters' || type === 'games') {
    box.innerHTML = `<div style="color:var(--muted); text-align:center; padding:40px 20px;">
      <div style="font-size:32px; margin-bottom:10px;">🚧</div>
      Раздел "${type === 'characters' ? 'Персонажи' : 'Игры'}" появится в обновлении 1.107
    </div>`;
    return;
  }

  const filtered = usersList.filter(u => u.username.toLowerCase().includes(q));
  
  if (filtered.length === 0) {
    box.innerHTML = "<div style='color:var(--muted); text-align:center; padding:20px;'>Никого не найдено</div>";
    return;
  }

  filtered.forEach(u => {
    const div = document.createElement('div');
    div.className = 'user-card';
    
    const avHtml = u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">` : u.username[0].toUpperCase();
    
    div.innerHTML = `
      <div class="header-avatar" style="width:44px; height:44px; font-size:18px;">${avHtml}</div>
      <div class="info">
        <div class="name">${u.username}</div>
        <div class="sub">Нажми, чтобы написать</div>
      </div>
      <button class="btn primary btn-sm" onclick="event.stopPropagation(); followUser(${u.id})">Подписаться</button>
    `;
    div.onclick = () => openChat(u.id, u.username);
    box.appendChild(div);
  });
}

async function followUser(targetId) {
  try {
    const res = await fetch('/api/follow', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({target_id: targetId})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Ошибка подписки");
    loadProfile(); 
    alert("Вы подписались!");
  } catch (e) { alert(e.message); }
}

async function loadChats() {
  try {
    const res = await fetch('/api/users', { headers: {'Authorization': 'Bearer ' + token} });
    if (!res.ok) return;
    const users = await res.json();
    
    const box = document.getElementById('chatList');
    // Сохраняем текущее количество, чтобы не перерисовывать зря
    if (box.children.length === users.length) return;
    
    box.innerHTML = "";
    if(users.length === 0) {
        box.innerHTML = "<div style='color:var(--muted); text-align:center; padding:20px;'>Нет других пользователей</div>";
        return;
    }
    users.forEach(u => {
      const div = document.createElement('div');
      div.className = 'chat-item';
      const avHtml = u.avatar ? `<img src="${u.avatar}" style="width:100%;height:100%;object-fit:cover;">` : u.username[0].toUpperCase();
      div.innerHTML = `
        <div class="header-avatar" style="width:40px; height:40px;">${avHtml}</div>
        <div style="font-weight:700;">${u.username}</div>
      `;
      div.onclick = () => openChat(u.id, u.username);
      box.appendChild(div);
    });
  } catch (e) { console.error(e); }
}

async function openChat(userId, userName) {
  currentChatId = userId;
  document.getElementById('chatWithName').textContent = userName;
  document.getElementById('chatScreen').style.display = 'flex';
  document.getElementById('messagesBox').innerHTML = "";
  
  await fetchMessages();
  
  if (chatPollInterval) clearInterval(chatPollInterval);
  chatPollInterval = setInterval(fetchMessages, 3000); 
}

function closeChat() {
  document.getElementById('chatScreen').style.display = 'none';
  currentChatId = null;
  if (chatPollInterval) clearInterval(chatPollInterval);
}

async function fetchMessages() {
  if (!currentChatId) return;
  try {
    const res = await fetch(`/api/messages/${currentChatId}`, { headers: {'Authorization': 'Bearer ' + token} });
    if (!res.ok) return;
    const msgs = await res.json();
    
    const box = document.getElementById('messagesBox');
    if (box.children.length === msgs.length) return; 

    box.innerHTML = "";
    msgs.forEach(m => {
      const div = document.createElement('div');
      const isMe = m.from_id === myUser.id;
      div.className = `msg ${isMe ? 'me' : 'them'}`;
      div.textContent = m.text;
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  } catch (e) { console.error(e); }
}

async function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  
  input.value = "";
  try {
    await fetch('/api/messages', {
      method: 'POST',
      headers: {'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json'},
      body: JSON.stringify({to_id: currentChatId, text: text})
    });
    fetchMessages();
  } catch (e) { alert("Ошибка отправки"); }
}

function switchTab(tabId, btn) {
  document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.nav-bottom button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if(tabId === 'tabChats') loadChats();
}

if (token) {
  enterApp();
} else {
  document.getElementById('authScreen').style.display = 'flex';
}
</script>
</body>
</html>
